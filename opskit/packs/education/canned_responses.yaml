industry: education
items:
  - key: greeting
    en: "Hello {{contact.name}}, thank you for messaging us. How can we help you today?"
    bn: "হ্যালো {{contact.name}}, আমাদের মেসেজ করার জন্য ধন্যবাদ। আজ আমরা আপনাকে কীভাবে সাহায্য করতে পারি?"
    review_required: true
  - key: handoff_human
    en: "I am passing your conversation to a team member who will reply soon."
    bn: "আমি আপনার কথোপকথনটি আমাদের একজন সদস্যের কাছে পাঠিয়ে দিচ্ছি, তিনি শীঘ্রই উত্তর দেবেন।"
    review_required: true
  - key: thanks
    en: "Thank you for contacting us. Have a great day!"
    bn: "আমাদের সাথে যোগাযোগ করার জন্য ধন্যবাদ। আপনার দিনটি শুভ হোক!"
    review_required: true
  - key: course_ask
    en: "Which course or class are you interested in, and for which student?"
    bn: "আপনি কোন কোর্স বা ক্লাস নিয়ে আগ্রহী এবং কোন শিক্ষার্থীর জন্য?"
    review_required: true
  - key: admission_how
    en: "To get admitted, please visit us or send the student's name, class and a contact number."
    bn: "ভর্তি হতে আমাদের অফিসে আসুন অথবা শিক্ষার্থীর নাম, ক্লাস ও যোগাযোগ নম্বর পাঠান।"
    review_required: true
  - key: fee_info
    en: "The fee for [course] is [fee]. Payment options: [payment options]."
    bn: "[কোর্স]-এর ফি [ফি]। পেমেন্টের পদ্ধতি: [পেমেন্ট পদ্ধতি]।"
    review_required: true
  - key: schedule_info
    en: "Classes run on [days] at [time]."
    bn: "ক্লাস হয় [দিন] [সময়ে]।"
    review_required: true
  - key: demo_offer
    en: "Would you like to join a free demo class? Please tell us a day that suits you."
    bn: "আপনি কি একটি বিনামূল্যের ডেমো ক্লাসে বসতে চান? আপনার সুবিধাজনক দিনটি জানান।"
    review_required: true
