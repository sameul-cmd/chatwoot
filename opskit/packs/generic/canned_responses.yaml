industry: generic
items:
  - key: greeting
    en: "Hello {{contact.name}}, thank you for messaging us. How can we help you today?"
    bn: "হ্যালো {{contact.name}}, আমাদের মেসেজ করার জন্য ধন্যবাদ। আজ আমরা আপনাকে কীভাবে সাহায্য করতে পারি?"
    review_required: true
  - key: please_wait
    en: "Thank you for your patience. We are checking this and will get back to you shortly."
    bn: "ধৈর্য ধরার জন্য ধন্যবাদ। আমরা বিষয়টি দেখছি এবং শীঘ্রই আপনাকে জানাব।"
    review_required: true
  - key: ask_details
    en: "Could you please share a few more details so we can help you better?"
    bn: "আপনাকে আরও ভালোভাবে সাহায্য করতে অনুগ্রহ করে আরও কিছু তথ্য জানাবেন?"
    review_required: true
  - key: ask_contact
    en: "May we have your name and the best phone number to reach you?"
    bn: "আপনার নাম এবং যোগাযোগের জন্য সবচেয়ে ভালো ফোন নম্বরটি কি জানাতে পারবেন?"
    review_required: true
  - key: handoff_human
    en: "I am passing your conversation to a team member who will reply soon."
    bn: "আমি আপনার কথোপকথনটি আমাদের একজন সদস্যের কাছে পাঠিয়ে দিচ্ছি, তিনি শীঘ্রই উত্তর দেবেন।"
    review_required: true
  - key: follow_up
    en: "Hello {{contact.first_name}}, we are following up on your earlier message. Do you still need help?"
    bn: "হ্যালো {{contact.first_name}}, আপনার আগের মেসেজের বিষয়ে জানতে চাইছি। আপনার কি এখনও সাহায্য দরকার?"
    review_required: true
  - key: thanks
    en: "Thank you for contacting us. Have a great day!"
    bn: "আমাদের সাথে যোগাযোগ করার জন্য ধন্যবাদ। আপনার দিনটি শুভ হোক!"
    review_required: true
  - key: closing
    en: "Is there anything else we can help you with? If not, we will close this chat."
    bn: "আর কোনো বিষয়ে কি আমরা সাহায্য করতে পারি? না হলে আমরা এই চ্যাটটি বন্ধ করে দেব।"
    review_required: true
