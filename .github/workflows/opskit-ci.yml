name: opskit-ci

on:
  push:
    paths:
      - "opskit/**"
      - "aibot/**"
      - "docs/**"
      - ".github/workflows/opskit-ci.yml"
  pull_request:
    paths:
      - "opskit/**"
      - "aibot/**"
      - "docs/**"
      - ".github/workflows/opskit-ci.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Install system tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck bats gettext-base jq age rclone
          pip install --quiet jsonschema pyyaml
      - uses: astral-sh/setup-uv@v5
      - name: Install Python 3.12 and aibot deps
        working-directory: aibot
        run: uv sync --python 3.12
      - name: opskit check (quick)
        run: opskit/bin/check --quick
